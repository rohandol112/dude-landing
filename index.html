<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title, description, canonical, social cards and structured data are injected from src/content/site.js -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Motion budget, decided before first paint so nothing flashes: "full" gets the hero unfold,
      the 3D sky and section videos; "lite" (reduced motion, Data Saver, 2G, under 4 GB memory or
      under 4 CPU cores) gets the finished stills. Read by src/lib/motion-budget.js and index.css.
    -->
    <script>
      (function () {
        var lite = true;
        try {
          var n = navigator;
          var c = n.connection || {};
          lite =
            matchMedia("(prefers-reduced-motion: reduce)").matches ||
            c.saveData === true ||
            /2g$/.test(c.effectiveType || "") ||
            (n.deviceMemory > 0 && n.deviceMemory < 4) ||
            (n.hardwareConcurrency > 0 && n.hardwareConcurrency < 4);
        } catch (e) {}
        document.documentElement.setAttribute("data-motion", lite ? "lite" : "full");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
